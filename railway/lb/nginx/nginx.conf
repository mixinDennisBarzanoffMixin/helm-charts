
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  63350;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    map $http_origin $usip_cors_allow_origin {
        default "";
        "~^https://([a-zA-Z0-9-]+\.)*veritly\.co\.uk$" $http_origin;
        "~^http://localhost(:[0-9]+)?$" $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    map $http_access_control_request_headers $usip_cors_allow_headers {
        default $http_access_control_request_headers;
        "" "authorization, content-type, cookie, x-requested-with, accept, origin, x-feature-id, x-unit-id, x-veritly-project-id";
    }

    include /etc/nginx/conf.d/*.conf;
}
